[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for the SoundAtlas MVP"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx2>=0.28.1",
    "pyright>=1.1.411",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
]

[tool.coverage.run]
source = [
    "app",
    "scripts",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "F",
    "I",
]
