name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Validate frontend release
        run: npm run validate:pages
        working-directory: frontend
        env:
          LEGACY_CSS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
