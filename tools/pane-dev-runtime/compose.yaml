services:
  egress:
    image: pane-dev-runtime-egress:phase1
    build: {context: ., dockerfile: egress.Dockerfile}
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ["/run:rw,noexec,nosuid,nodev,size=1m"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/pane-runtime-egress-guard", "check"]
      interval: 5s
      timeout: 5s
      retries: 3
    ports: ["127.0.0.1:${PANE_RUNTIME_SSH_PORT:-53670}:2222"]
  runtime:
    image: pane-dev-runtime:phase1
    build: {context: ., dockerfile: Dockerfile}
    init: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true, seccomp=./config/pane-seccomp.json]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=256m", "/run:rw,nosuid,size=64m,uid=10001,gid=10001,mode=0755"]
    environment:
      PANE_REPOSITORY_NAME: ${PANE_REPOSITORY_NAME:?set a disposable repository name}
      PANE_GIT_AUTHOR_NAME: ${PANE_GIT_AUTHOR_NAME:-}
      PANE_GIT_AUTHOR_EMAIL: ${PANE_GIT_AUTHOR_EMAIL:-}
      PANE_GIT_AUTOCRLF: ${PANE_GIT_AUTOCRLF:-}
    volumes:
      - pane_state:/runtime/pane
      - ssh_state:/runtime/ssh
      - codex_config:/runtime/codex
      - type: bind
        source: ${PANE_PROOF_ROOT:?set an absolute disposable proof-root path}
        target: /runtime/repos
      - type: bind
        source: ${PANE_AUTHORIZED_KEYS_FILE:?set a test-only authorized-keys file}
        target: /runtime/ssh/authorized_keys
        read_only: true
      - type: bind
        source: ${PANE_CODEX_AUTH_FILE:?set a synthetic Codex auth-shaped file}
        target: /runtime/codex/auth.json
        read_only: true
    network_mode: service:egress
    depends_on:
      egress: {condition: service_healthy}
volumes:
  pane_state:
  ssh_state:
  codex_config:
