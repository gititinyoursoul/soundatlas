<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">First-level route and review navigation</title>
  <desc id="desc">SoundAtlas design target. A desktop editorial view and narrow-screen drawer show separate first-level Routes and Routes to review lists. The map view shows route context only; route switching occurs in navigation.</desc>
  <defs>
    <style>
      .ui { font-family: Inter, Arial, sans-serif; fill: #17202a; }
      .eyebrow { font: 800 11px Inter, Arial, sans-serif; letter-spacing: 1.3px; fill: #6b7785; }
      .title { font: 800 22px Inter, Arial, sans-serif; fill: #17202a; }
      .body { font: 600 13px Inter, Arial, sans-serif; fill: #536170; }
      .small { font: 700 11px Inter, Arial, sans-serif; fill: #6b7785; }
      .strong { font: 800 13px Inter, Arial, sans-serif; fill: #17202a; }
      .panel { fill: #fff; stroke: #cfd7df; }
      .soft { fill: #f7f9fb; stroke: #d9e0e7; }
      .active { fill: #fff5f1; stroke: #e4572e; }
      .divider { stroke: #d9e0e7; }
    </style>
  </defs>

  <rect width="1600" height="1200" fill="#eef2f5"/>
  <text x="40" y="42" class="eyebrow">SOUNDATLAS UX TARGET · ISSUE #161</text>
  <text x="40" y="74" class="title">Routes and Routes to review stay separate</text>
  <text x="40" y="98" class="body">Route switching happens only in first-level navigation. The map workspace keeps one selected route or review revision in context.</text>

  <!-- Desktop editorial state, based on the current map / timeline / StoryPanel shell. -->
  <g aria-label="Editorial desktop navigation target">
    <rect x="40" y="130" width="1050" height="1010" rx="10" class="panel"/>
    <rect x="40" y="130" width="720" height="82" rx="10" fill="#ffffff" stroke="#d9e0e7"/>
    <text x="62" y="158" class="eyebrow">SOUNDATLAS · NEW YORK 1965–1985</text>
    <text x="62" y="188" class="title">Birth of Hip-Hop <tspan font-size="14">1970–1985</tspan></text>
    <text x="430" y="176" class="small">EDITORIAL MODE · ACTIVE REVIEW</text>
    <rect x="606" y="154" width="132" height="32" rx="16" class="soft"/>
    <text x="624" y="175" class="strong">12 events visible</text>

    <rect x="40" y="212" width="720" height="740" fill="#dfe9e2" stroke="#d9e0e7"/>
    <path d="M105 822 C190 715 258 770 340 620 C420 472 560 564 690 340" fill="none" stroke="#9ab3a2" stroke-width="38" opacity=".55"/>
    <path d="M130 805 C220 720 282 749 356 627 C455 472 548 530 674 354" fill="none" stroke="#e4572e" stroke-width="3" stroke-dasharray="9 8"/>
    <circle cx="205" cy="745" r="17" fill="#e4572e" stroke="#fff" stroke-width="4"/>
    <circle cx="360" cy="628" r="15" fill="#314151" stroke="#fff" stroke-width="4"/>
    <circle cx="528" cy="520" r="15" fill="#314151" stroke="#fff" stroke-width="4"/>
    <rect x="64" y="808" width="268" height="88" rx="8" fill="#fff" stroke="#cfd7df"/>
    <text x="82" y="834" class="eyebrow">SELECTED EVENT</text>
    <text x="82" y="860" class="strong">Caribbean sound systems</text>
    <text x="82" y="880" class="body">South Bronx · 1967–1972</text>

    <rect x="40" y="952" width="720" height="188" rx="0" fill="#fbfcfd" stroke="#d9e0e7"/>
    <line x1="84" y1="1000" x2="716" y2="1000" stroke="#aab6c1" stroke-width="4"/>
    <circle cx="116" cy="1000" r="15" fill="#e4572e" stroke="#fff" stroke-width="4"/>
    <circle cx="242" cy="1000" r="11" fill="#314151" stroke="#fff" stroke-width="3"/>
    <circle cx="380" cy="1000" r="11" fill="#314151" stroke="#fff" stroke-width="3"/>
    <circle cx="526" cy="1000" r="11" fill="#314151" stroke="#fff" stroke-width="3"/>
    <rect x="64" y="1034" width="196" height="82" rx="7" class="active"/>
    <text x="80" y="1056" class="small">1967–1972</text>
    <text x="80" y="1080" class="strong">Caribbean sound systems</text>
    <text x="80" y="1100" class="small">SELECTED</text>
    <rect x="274" y="1034" width="196" height="82" rx="7" class="soft"/>
    <text x="290" y="1056" class="small">1973</text>
    <text x="290" y="1080" class="strong">Kool Herc's party</text>

    <rect x="760" y="130" width="330" height="1010" rx="10" fill="#fff" stroke="#cfd7df"/>
    <text x="782" y="158" class="eyebrow">ACTIVE REVIEW REVISION</text>
    <text x="782" y="190" class="title">Birth of Hip-Hop</text>
    <text x="782" y="214" class="body">No published revision · current review</text>
    <rect x="782" y="238" width="286" height="76" rx="8" fill="#fff8e8" stroke="#f0d38b"/>
    <text x="800" y="266" class="strong">Review before publication</text>
    <text x="800" y="290" class="body">One exact revision is active.</text>
    <text x="782" y="348" class="eyebrow">ROUTE EVENTS</text>
    <rect x="782" y="364" width="286" height="62" rx="7" class="soft"/>
    <text x="800" y="390" class="strong">Caribbean sound systems</text>
    <text x="800" y="412" class="small">Draft review content</text>
    <rect x="782" y="438" width="286" height="62" rx="7" class="soft"/>
    <text x="800" y="464" class="strong">Kool Herc's party</text>
    <text x="800" y="486" class="small">Draft review content</text>
    <rect x="782" y="526" width="286" height="46" rx="7" fill="#263746"/>
    <text x="850" y="555" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#fff">PUBLISH THIS REVISION</text>
    <text x="782" y="598" class="small">Only this route revision is affected.</text>
    <text x="782" y="620" class="small">No bulk action is implied.</text>

    <!-- Overlay navigation; the only route-switching surface. -->
    <rect x="40" y="130" width="336" height="1010" rx="10" fill="#fff" stroke="#cfd7df"/>
    <text x="62" y="160" class="eyebrow">SOUNDATLAS</text>
    <text x="62" y="190" class="title">Navigation</text>
    <rect x="294" y="150" width="46" height="34" rx="8" class="soft"/>
    <text x="309" y="173" class="strong">×</text>
    <line x1="40" y1="212" x2="376" y2="212" class="divider"/>
    <text x="62" y="242" class="eyebrow">ROUTES</text>
    <rect x="56" y="256" width="304" height="70" rx="8" class="soft"/>
    <circle cx="78" cy="290" r="7" fill="#d1495b"/>
    <text x="96" y="284" class="strong">New York Builds the Dance Floor</text>
    <text x="96" y="306" class="small">Published revision</text>
    <text x="62" y="358" class="eyebrow">ROUTES TO REVIEW</text>
    <rect x="56" y="372" width="304" height="76" rx="8" class="active"/>
    <rect x="56" y="372" width="5" height="76" rx="2" fill="#e4572e"/>
    <circle cx="78" cy="410" r="7" fill="#e4572e"/>
    <text x="96" y="404" class="strong">Birth of Hip-Hop</text>
    <text x="96" y="428" class="small">No published revision · active review</text>
    <text x="62" y="486" class="eyebrow">ADMIN</text>
    <rect x="56" y="500" width="304" height="48" rx="8" class="soft"/>
    <text x="78" y="530" class="strong">Media review</text>
    <text x="62" y="1098" class="small">Navigation is the only route-selection surface.</text>
  </g>

  <!-- Narrow-screen state. -->
  <g aria-label="Narrow-screen navigation target">
    <rect x="1130" y="130" width="430" height="1010" rx="10" class="panel"/>
    <text x="1152" y="160" class="eyebrow">NARROW SCREEN · EDITORIAL MODE</text>
    <text x="1152" y="190" class="title">First-level route lists</text>
    <rect x="1152" y="218" width="386" height="62" rx="8" fill="#fff" stroke="#d9e0e7"/>
    <text x="1170" y="244" class="eyebrow">ACTIVE CONTEXT</text>
    <text x="1170" y="266" class="strong">Birth of Hip-Hop · review revision</text>
    <rect x="1152" y="300" width="386" height="794" rx="8" fill="#fff" stroke="#cfd7df"/>
    <text x="1172" y="332" class="eyebrow">ROUTES</text>
    <rect x="1168" y="348" width="354" height="66" rx="7" class="soft"/>
    <circle cx="1190" cy="381" r="7" fill="#d1495b"/>
    <text x="1208" y="376" class="strong">New York Builds the Dance Floor</text>
    <text x="1208" y="398" class="small">Published revision</text>
    <line x1="1168" y1="440" x2="1522" y2="440" class="divider"/>
    <text x="1172" y="472" class="eyebrow">ROUTES TO REVIEW</text>
    <rect x="1168" y="488" width="354" height="76" rx="7" class="active"/>
    <rect x="1168" y="488" width="5" height="76" rx="2" fill="#e4572e"/>
    <circle cx="1190" cy="526" r="7" fill="#e4572e"/>
    <text x="1208" y="520" class="strong">Birth of Hip-Hop</text>
    <text x="1208" y="544" class="small">No published revision</text>
    <line x1="1168" y1="590" x2="1522" y2="590" class="divider"/>
    <text x="1172" y="622" class="eyebrow">MODE BOUNDARIES</text>
    <text x="1172" y="652" class="strong">Public</text>
    <text x="1260" y="652" class="body">Routes only</text>
    <text x="1172" y="684" class="strong">API/admin</text>
    <text x="1260" y="684" class="body">Routes + media review</text>
    <text x="1172" y="716" class="strong">Editorial</text>
    <text x="1260" y="716" class="body">Routes + Routes to review</text>
    <rect x="1168" y="756" width="354" height="98" rx="8" fill="#fff8e8" stroke="#f0d38b"/>
    <text x="1186" y="786" class="strong">One active review revision</text>
    <text x="1186" y="810" class="body">Publication stays route-specific.</text>
    <text x="1186" y="832" class="body">No bulk action.</text>
    <text x="1172" y="1066" class="small">No nested route screen. No main-view selector.</text>
  </g>
</svg>
